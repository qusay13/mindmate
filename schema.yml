openapi: 3.0.3
info:
  title: MindMate API
  version: 1.0.0
  description: Professional Mental Health Platform API for Mobile and Web
paths:
  /api/accounts/admin/doctors/{doctor_id}/deactivate/:
    post:
      operationId: accounts_admin_doctors_deactivate_create
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/accounts/admin/stats/:
    get:
      operationId: accounts_admin_stats_retrieve
      description: |-
        GET /api/accounts/admin/stats/
        Returns general statistics for the admin dashboard.
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/accounts/admin/users/:
    get:
      operationId: accounts_admin_users_list
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/admin/users/{user_id}/deactivate/:
    post:
      operationId: accounts_admin_users_deactivate_create
      parameters:
      - in: path
        name: user_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/accounts/email/verify/confirm/:
    post:
      operationId: accounts_email_verify_confirm_create
      description: |-
        POST /api/accounts/email/verify/confirm/
        Body: { "token": "..." }
        يفعّل الحساب بعد التحقق من الـ token.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/email/verify/request/:
    post:
      operationId: accounts_email_verify_request_create
      description: |-
        POST /api/accounts/email/verify/request/
        Body: { "email": "...", "role": "user" | "doctor" }
        يرسل رابط تأكيد البريد الإلكتروني.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/login/:
    post:
      operationId: accounts_login_create
      description: Authenticate user and return a session token with profile data.
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: ''
  /api/accounts/logout/:
    post:
      operationId: accounts_logout_create
      tags:
      - accounts
      responses:
        '200':
          description: No response body
  /api/accounts/password/reset/confirm/:
    post:
      operationId: accounts_password_reset_confirm_create
      description: |-
        POST /api/accounts/password/reset/confirm/
        Body: { "token": "...", "new_password": "..." }
        يضبط كلمة المرور الجديدة ويلغي جميع الجلسات.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/password/reset/request/:
    post:
      operationId: accounts_password_reset_request_create
      description: |-
        POST /api/accounts/password/reset/request/
        Body: { "email": "...", "role": "user" | "doctor" }
        يرسل رابط إعادة تعيين كلمة المرور.
      tags:
      - accounts
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/accounts/profile/doctor/:
    get:
      operationId: accounts_profile_doctor_retrieve
      description: |-
        GET /api/accounts/profile/doctor/
        يعيد بيانات الملف الشخصي للطبيب المسجّل.
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: Doctor profile data
    patch:
      operationId: accounts_profile_doctor_partial_update
      description: |-
        PATCH /api/accounts/profile/doctor/
        يحدّث بيانات الملف الشخصي للطبيب (specialization, bio, whatsapp_number, ...).
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedDoctorRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedDoctorRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Doctor'
          description: Doctor profile updated
  /api/accounts/profile/user/:
    get:
      operationId: accounts_profile_user_retrieve
      tags:
      - accounts
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: accounts_profile_user_partial_update
      tags:
      - accounts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/accounts/register/doctor/:
    post:
      operationId: accounts_register_doctor_create
      description: |-
        POST /api/accounts/register/doctor/
        يسجّل حساب طبيب جديد. يعيد رسالة تأكيد بعد إرسال بريد التحقق.
      tags:
      - accounts
      security:
      - {}
      responses:
        '201':
          description: Doctor registered successfully. Verification email sent.
  /api/accounts/register/user/:
    post:
      operationId: accounts_register_user_create
      description: Register a new patient user.
      tags:
      - accounts
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/chat/conversations/:
    get:
      operationId: chat_conversations_list
      tags:
      - chat
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
          description: ''
  /api/chat/conversations/{conversation_id}/messages/:
    get:
      operationId: chat_conversations_messages_list
      parameters:
      - in: path
        name: conversation_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - chat
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
          description: ''
  /api/chatbot/conversation/:
    get:
      operationId: chatbot_conversation_retrieve
      tags:
      - chatbot
      responses:
        '200':
          description: No response body
  /api/chatbot/message/:
    post:
      operationId: chatbot_message_create
      description: |-
        POST /api/chatbot/message/
        Body: { "message": "نص الرسالة" }
        يرسل رسالة للـ AI ويعيد رد الـ bot فوراً.
      tags:
      - chatbot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatbotMessageRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatbotMessageResponse'
          description: Message sent — returns user message and bot reply
  /api/clinic/doctor/patients/:
    get:
      operationId: clinic_doctor_patients_list
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Patient'
          description: ''
  /api/clinic/doctor/patients/{patient_id}/:
    get:
      operationId: clinic_doctor_patients_retrieve
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          description: No response body
  /api/clinic/doctor/patients/{patient_id}/analysis/:
    get:
      operationId: clinic_doctor_patients_analysis_list
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalAnalysis'
          description: ''
  /api/clinic/doctor/patients/{patient_id}/journals/:
    get:
      operationId: clinic_doctor_patients_journals_list
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
          description: ''
  /api/clinic/doctor/patients/{patient_id}/mood/:
    get:
      operationId: clinic_doctor_patients_mood_list
      parameters:
      - in: path
        name: patient_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyMood'
          description: ''
  /api/clinic/doctor/requests/:
    get:
      operationId: clinic_doctor_requests_list
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorPatientRequest'
          description: ''
  /api/clinic/doctor/requests/{request_id}/action/:
    post:
      operationId: clinic_doctor_requests_action_create
      description: |-
        POST /api/clinic/doctor/requests/{request_id}/action/
        Body: { "action": "accept" | "reject" }
        يقبل أو يرفض الطبيب طلب الربط من المريض.
      parameters:
      - in: path
        name: request_id
        schema:
          type: integer
        required: true
      tags:
      - clinic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRequestActionRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
          description: Action performed successfully
  /api/clinic/doctors/{doctor_id}/:
    get:
      operationId: clinic_doctors_retrieve
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorProfileLite'
          description: ''
  /api/clinic/doctors/{doctor_id}/approve/:
    patch:
      operationId: clinic_doctors_approve_partial_update
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          description: No response body
  /api/clinic/doctors/{doctor_id}/contact/:
    get:
      operationId: clinic_doctors_contact_retrieve
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          description: No response body
  /api/clinic/doctors/{doctor_id}/ratings/:
    get:
      operationId: clinic_doctors_ratings_list
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorRating'
          description: ''
    post:
      operationId: clinic_doctors_ratings_create
      parameters:
      - in: path
        name: doctor_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - clinic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DoctorRatingRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DoctorRatingRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DoctorRatingRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DoctorRating'
          description: ''
  /api/clinic/doctors/admin-list/:
    get:
      operationId: clinic_doctors_admin_list_list
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorProfileLite'
          description: ''
  /api/clinic/doctors/list/:
    get:
      operationId: clinic_doctors_list_list
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DoctorProfileLite'
          description: ''
  /api/clinic/link/:
    post:
      operationId: clinic_link_create
      description: |-
        POST /api/clinic/link/
        Body: { "doctor_id": "<uuid>", "request_type": "user_selected" }
        يرسل المريض طلب ربط إلى الطبيب. يبقى الطلب بحالة pending حتى يوافق الطبيب.
      tags:
      - clinic
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatientDoctorLinkRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  request_id:
                    type: integer
          description: Link request sent successfully
  /api/clinic/suggest-doctor/:
    get:
      operationId: clinic_suggest_doctor_retrieve
      description: Returns a suggested doctor based on the user's most severe recent
        questionnaire results.
      tags:
      - clinic
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/notifications/doctor/:
    get:
      operationId: notifications_doctor_retrieve
      description: |-
        GET /api/notifications/doctor/
        يعيد قائمة الإشعارات الخاصة بالطبيب.
        Query params:
          ?unread=true  — إشعارات غير مقروءة فقط
      tags:
      - notifications
      responses:
        '200':
          description: No response body
  /api/notifications/doctor/{notification_id}/:
    delete:
      operationId: notifications_doctor_destroy
      description: DELETE /api/notifications/doctor/<notification_id>/
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      responses:
        '204':
          description: No response body
  /api/notifications/doctor/mark-read/:
    post:
      operationId: notifications_doctor_mark_read_create
      description: |-
        POST /api/notifications/doctor/mark-read/
        Body (optional): { "notification_ids": [1, 2, 3] }
      tags:
      - notifications
      responses:
        '200':
          description: No response body
  /api/notifications/user/:
    get:
      operationId: notifications_user_retrieve
      description: |-
        GET /api/notifications/user/
        يعيد قائمة الإشعارات الخاصة بالمستخدم (الأحدث أولاً).
        Query params:
          ?unread=true  — إشعارات غير مقروءة فقط
      tags:
      - notifications
      responses:
        '200':
          description: No response body
  /api/notifications/user/{notification_id}/:
    delete:
      operationId: notifications_user_destroy
      description: |-
        DELETE /api/notifications/user/<notification_id>/
        يحذف إشعاراً واحداً للمستخدم.
      parameters:
      - in: path
        name: notification_id
        schema:
          type: integer
        required: true
      tags:
      - notifications
      responses:
        '204':
          description: No response body
  /api/notifications/user/mark-read/:
    post:
      operationId: notifications_user_mark_read_create
      description: |-
        POST /api/notifications/user/mark-read/
        Body (optional): { "notification_ids": [1, 2, 3] }
        إذا لم يُرسَل الـ body يُعلَّم الكل مقروءاً.
      tags:
      - notifications
      responses:
        '200':
          description: No response body
  /api/survey/questions/:
    get:
      operationId: survey_questions_list
      tags:
      - survey
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InitialSurveyQuestion'
          description: ''
  /api/survey/submit/:
    post:
      operationId: survey_submit_create
      description: Submit the initial onboarding survey responses.
      tags:
      - survey
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitSurveyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitSurveyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitSurveyRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/tracking/analysis/:
    get:
      operationId: tracking_analysis_retrieve
      description: Returns a comprehensive 30-day mental health analysis, including
        score history, patterns, and recommendations.
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/tracking/daily-tip/:
    get:
      operationId: tracking_daily_tip_retrieve
      description: Fetches the daily tip generated when the user completed all 3 tasks
        today.
      tags:
      - tracking
      responses:
        '200':
          description: No response body
  /api/tracking/journal/:
    get:
      operationId: tracking_journal_retrieve
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: ''
    post:
      operationId: tracking_journal_create
      tags:
      - tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/JournalEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/JournalEntryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
          description: ''
  /api/tracking/journal/history/:
    get:
      operationId: tracking_journal_history_list
      description: Returns the user's past journal entries.
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/JournalEntry'
          description: ''
  /api/tracking/journal/sharing/:
    get:
      operationId: tracking_journal_sharing_retrieve
      description: |-
        GET /api/tracking/journal/sharing/
        يعيد حالة إذن المشاركة الحالية للمجلة مع الطبيب.
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  share_full_journal:
                    type: boolean
                  share_analysis_only:
                    type: boolean
          description: Current sharing permission state
    post:
      operationId: tracking_journal_sharing_create
      description: |-
        POST /api/tracking/journal/sharing/
        Body: { "share_full_journal": true | false }
        يضبط إذن مشاركة المجلة الكاملة مع الطبيب المرتبط.
      tags:
      - tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JournalSharingRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  share_full_journal:
                    type: boolean
          description: Sharing permission updated
  /api/tracking/mood/:
    get:
      operationId: tracking_mood_retrieve
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMood'
          description: ''
    post:
      operationId: tracking_mood_create
      tags:
      - tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMoodRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/DailyMoodRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/DailyMoodRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMood'
          description: ''
  /api/tracking/progress/:
    get:
      operationId: tracking_progress_retrieve
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyProgress'
          description: ''
  /api/tracking/questionnaires/:
    get:
      operationId: tracking_questionnaires_list
      tags:
      - tracking
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QuestionnaireType'
          description: ''
  /api/tracking/questionnaires/{code}/questions/:
    get:
      operationId: tracking_questionnaires_questions_retrieve
      parameters:
      - in: path
        name: code
        schema:
          type: string
        required: true
      tags:
      - tracking
      responses:
        '200':
          description: No response body
  /api/tracking/questionnaires/submit/:
    post:
      operationId: tracking_questionnaires_submit_create
      description: Submit questionnaire answers and receive severity analysis and
        AI doctor suggestion.
      tags:
      - tracking
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitQuestionnaireRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubmitQuestionnaireRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmitQuestionnaireRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmitQuestionnaireResponse'
          description: ''
components:
  schemas:
    Admin:
      type: object
      properties:
        admin_id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
